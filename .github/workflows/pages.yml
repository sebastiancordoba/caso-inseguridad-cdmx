# Publica SOLO docs/app en GitHub Pages. No compila nada: sube la carpeta tal cual.
# Se usa esto y no «Pages sobre docs/» para que el sitio sea solo la app.
name: Publica la app

# Solo a mano (Actions → «Publica la app» → Run workflow): Sebastián decide cuándo queda pública.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publica:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.despliega.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/app
      - id: despliega
        uses: actions/deploy-pages@v4
